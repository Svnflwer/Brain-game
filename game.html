<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игровой Экран</title>
    <style>
        body { margin:0; padding:0; background:#0a0a14; color:white; font-family:sans-serif; text-align:center; user-select:none; touch-action:none; overflow:hidden; }
        .screen { display:none; position:fixed; width:100vw; height:100vh; left:0; top:0; flex-direction:column; align-items:center; justify-content:center; box-sizing:border-box; padding:20px; }
        .active { display:flex; }
        .btn { padding:14px 25px; margin:8px; background:#1a1a3a; color:#00d2ff; border:2px solid #00d2ff; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; width:80%; max-width:280px; box-shadow:0 0 10px rgba(0,210,255,0.2); text-transform:uppercase; }
        .btn:active { background:#00d2ff; color:#000; }
        .u-panel { display:flex; align-items:center; gap:12px; position:absolute; top:20px; background:rgba(255,255,255,0.05); padding:5px 15px; border-radius:30px; border:1px solid rgba(0,210,255,0.3); }
        .u-av { width:35px; height:35px; border-radius:50%; border:2px solid #00d2ff; object-fit:cover; background:#1a1a3a; }
        canvas { background:#111; border:2px solid #ff0055; border-radius:10px; max-width:42vw; margin-top:20px; }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="scr-menu" class="screen active">
        <div class="u-panel">
            <img class="u-av" id="m-av" src="">
            <span id="m-name" style="color:#00d2ff; font-weight:bold;"></span>
        </div>
        <h1 style="color:#ff0055; text-shadow:0 0 10px #ff0055; margin-top:60px;">МЕНЮ ИГР</h1>
        <button class="btn" onclick="setScreen('scr-math-setup')">📊 МАТЕМАТИКА</button>
        <button class="btn" onclick="startFind()">👁️ НАЙДИ ОТЛИЧИЕ</button>
        <button class="btn" style="background:#333; border-color:#888; color:#fff; margin-top:20px;" onclick="window.location.href='index.html'">👤 СМЕНИТЬ ПРОФИЛЬ</button>
    </div>

    <!-- ЭКРАН 2: СЛОЖНОСТЬ МАТЕМАТИКИ -->
    <div id="scr-math-setup" class="screen">
        <h2>ВЫБЕРИ СЛОЖНОСТЬ:</h2>
        <button class="btn" style="background:#4caf50; border-color:#4caf50; color:#fff;" onclick="playMath('easy')">🟢 3 КЛАСС (ПЛЮС / МИНУС)</button>
        <button class="btn" style="background:#ff9800; border-color:#ff9800; color:#fff;" onclick="playMath('medium')">🟡 6 КЛАСС (УМНОЖЕНИЕ)</button>
        <button class="btn" style="background:#f44336; border-color:#f44336; color:#fff;" onclick="playMath('hard')">🔴 ПРОФИ (ТРЕХЗНАЧНЫЕ)</button>
        <button class="btn" style="background:#333; border-color:#888; color:#fff; margin-top:20px;" onclick="setScreen('scr-menu')">НАЗАД 🔙</button>
    </div>

    <!-- ЭКРАН 3: ИГРА МАТЕМАТИКА -->
    <div id="scr-math-game" class="screen">
        <div style="display:flex; justify-content:space-between; width:100%; max-width:300px; font-size:18px; font-weight:bold; color:#00d2ff;">
            <div id="m-timer">⏱️ ВРЕМЯ: 30</div>
            <div id="m-score">⭐ ОЧКИ: 0</div>
        </div>
        <div id="m-question" style="font-size:38px; font-weight:bold; margin:40px 0; word-break:break-all;">2 × 2 = ?</div>
        <div id="m-answers" style="display:grid; grid-template-columns:1fr 1fr; gap:15px; width:100%; max-width:300px;"></div>
    </div>

    <!-- ЭКРАН 4: НАЙДИ ОТЛИЧИЕ -->
    <div id="scr-find-game" class="screen">
        <div style="font-size:18px; font-weight:bold; color:#ff0055; margin-bottom:10px;">⭐ ОЧКИ: <span id="f-score">0</span></div>
        <h3 style="color:#00d2ff; margin:0;">Найди круг другого цвета!</h3>
        <div style="display:flex; gap:15px;">
            <canvas id="can1" width="130" height="130" onclick="clickCan(1)"></canvas>
            <canvas id="can2" width="130" height="130" onclick="clickCan(2)"></canvas>
        </div>
        <button class="btn" style="background:#333; border-color:#888; color:#fff; margin-top:40px;" onclick="setScreen('scr-menu')">В МЕНЮ 🏠</button>
    </div>

    <script>
        let score = 0, timeLeft = 30, gameInterval, correctAns = 0, diffMode = 'easy', oddCan = 1;

        // Подгружаем имя и фото из памяти телефона
        const savedName = localStorage.getItem('userName') || "Игрок";
        const savedAv = localStorage.getItem('userAvatar') || "data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%2300d2ff'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>";
        
        document.getElementById('m-name').innerText = savedName;
        document.getElementById('m-av').src = savedAv;

        function setScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }

        // ЛОГИКА МАТЕМАТИКИ
        function playMath(diff) {
            diffMode = diff; score = 0; timeLeft = 30;
            document.getElementById('m-score').innerText = '⭐ ОЧКИ: ' + score;
            document.getElementById('m-timer').innerText = '⏱️ ВРЕМЯ: ' + timeLeft;
            setScreen('scr-math-game'); makeMathQ();
            clearInterval(gameInterval);
            gameInterval = setInterval(() => {
                timeLeft--; document.getElementById('m-timer').innerText = '⏱️ ВРЕМЯ: ' + timeLeft;
                if(timeLeft <= 0) { clearInterval(gameInterval); alert('⏱️ Время вышло! Твои очки: ' + score); setScreen('scr-menu'); }
            }, 1000);
        }

        function makeMathQ() {
            let a, b, op = '+';
            if (diffMode === 'easy') { // 3 класс
                a = Math.floor(Math.random() * 80) + 10; b = Math.floor(Math.random() * 80) + 10;
                op = Math.random() > 0.5 ? '+' : '-'; if(op === '-' && a < b) { let t = a; a = b; b = t; }
                correctAns = op === '+' ? a + b : a - b;
            } else if (diffMode === 'medium') { // 6 класс
                a = Math.floor(Math.random() * 12) + 2; b = Math.floor(Math.random() * 9) + 2;
                op = '×'; correctAns = a * b;
            } else { // Профи (трехзначные)
                a = Math.floor(Math.random() * 800) + 100; b = Math.floor(Math.random() * 800) + 100;
                op = Math.random() > 0.5 ? '+' : '-'; if(op === '-' && a < b) { let t = a; a = b; b = t; }
                correctAns = op === '+' ? a + b : a - b;
            }
            
            document.getElementById('m-question').innerText = `${a} ${op} ${b} = ?`;
            let choices = [correctAns];
            while(choices.length < 4) {
                let w = correctAns + (Math.floor(Math.random() * 20) - 10);
                if(w !== correctAns && w >= 0 && !choices.includes(w)) choices.push(w);
            }
            choices.sort(() => Math.random() - 0.5);
            const box = document.getElementById('m-answers'); box.innerHTML = '';
            choices.forEach(c => {
                const btn = document.createElement('button'); btn.className = 'btn'; btn.style.width = '100%'; btn.innerText = c;
                btn.onclick = () => { 
                    if(c === correctAns) { 
                        score += diffMode==='easy'?10:diffMode==='medium'?20:40; 
                    } else { 
                        timeLeft = Math.max(0, timeLeft - 5); // Штраф -5 секунд!
                    } 
                    document.getElementById('m-score').innerText = '⭐ ОЧКИ: ' + score; 
                    makeMathQ(); 
                };
                box.appendChild(btn);
            });
        }

        // ЛОГИКА НАЙДИ ОТЛИЧИЕ
        function startFind() { score = 0; document.getElementById('f-score').innerText = score; setScreen('scr-find-game'); makeDiff(); }
        function makeDiff() {
            oddCan = Math.random() > 0.5 ? 1 : 2;
            let h = Math.random()*360, nColor = `hsl(${h},80%,50%)`, dColor = `hsl(${h},80%,65%)`;
            drawC('can1', oddCan === 1 ? dColor : nColor); drawC('can2', oddCan === 2 ? dColor : nColor);
        }
        function drawC(id, color) {
            const c = document.getElementById(id), ctx = c.getContext('2d');
            ctx.clearRect(0,0,130,130); ctx.fillStyle = color; ctx.beginPath(); ctx.arc(65,65,35,0,Math.PI*2); ctx.fill();
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(53,55,5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(77,55,5,0,Math.PI*2); ctx.fill();
        }
        function clickCan(id) {
            if(id === oddCan) { score += 10; document.getElementById('f-score').innerText = score; makeDiff(); }
            else { score = Math.max(0, score - 5); document.getElementById('f-score').innerText = score; alert('❌ Мимо! Ищи другое пятно.'); }
        }
    </script>
</body>
</html>
