<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Вход в игру</title>
    <style>
        body { margin:0; padding:0; background:#0a0a14; color:white; font-family:sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; text-align:center; user-select:none; }
        .btn { padding:14px 25px; margin:10px; background:#1a1a3a; color:#00d2ff; border:2px solid #00d2ff; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; width:80%; max-width:260px; box-shadow:0 0 10px rgba(0,210,255,0.2); text-transform:uppercase; }
        #av-preview { width:100px; height:100px; border-radius:50%; border:3px solid #00d2ff; object-fit:cover; margin:15px 0; background:#1a1a3a; }
    </style>
</head>
<body>

    <h2 style="color:#00d2ff; text-shadow:0 0 10px #00d2ff;">СОЗДАЙ ПРОФИЛЬ</h2>
    
    <img id="av-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://w3.org' viewBox='0 0 24 24' fill='%2300d2ff'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z'/></svg>">
    
    <label class="btn" style="background:#00d2ff; color:#000; padding:10px; font-size:14px; max-width:180px;">
        ВЫБРАТЬ ФОТО 📸
        <input type="file" accept="image/*" style="display:none;" onchange="loadAv(this)">
    </label>
    
    <input type="text" id="nick-input" placeholder="Твой ник..." style="padding:12px; font-size:16px; border-radius:8px; border:2px solid #00d2ff; background:#101026; color:white; width:70%; max-width:240px; margin-top:15px; text-align:center; outline:none;">
    
    <button class="btn" style="margin-top:25px;" onclick="goToGame()">ИГРАТЬ ➡️</button>

    <script>
        let avData = "";
        function loadAv(input) {
            if (input.files && input.files[0]) {
                const r = new FileReader();
                r.onload = e => { 
                    avData = e.target.result; 
                    document.getElementById('av-preview').src = avData; 
                    localStorage.setItem('userAvatar', avData);
                };
                r.readAsDataURL(input.files[0]);
            }
        }
        function goToGame() {
            const n = document.getElementById('nick-input').value.trim();
            localStorage.setItem('userName', n ? n : "Игрок");
            window.location.href = "game.html"; // Перекидываем на второй файл!
        }
    </script>
</body>
</html>
